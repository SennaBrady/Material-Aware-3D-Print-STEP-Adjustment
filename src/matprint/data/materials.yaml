    hole_offset_mm: null
    contour_offset_mm: 0.0
    max_use_temp_c: []
    chemical: {acids: unknown, bases: unknown, water: unknown, solvents: unknown}
    uv_resistant: null
    tensile_mpa: null
    modulus_gpa: null
    elongation_pct: null
    resistivity_ohm_cm: null
    min_feature_mm: null
    min_wall_mm: 1.2
    infill_pct: {functional: [20, 40]}
