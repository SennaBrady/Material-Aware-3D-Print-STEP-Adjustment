    modulus_gpa: null
    elongation_pct: 23
    resistivity_ohm_cm: null
    min_feature_mm: null
    min_wall_mm: 1.2
    infill_pct: {functional: [20, 40]}
    notes: "good layer adhesion"
    sources: [grandpacad, bambu, create, xometry, sourcecad]

