# Material database for matprint.
#
# Units: shrinkage in percent (linear, XY), offsets and sizes in mm,
# temperatures in degC, strength in MPa / GPa / %, resistivity in ohm*cm.
#
# Seeded from the project overview's property tables. A value of null means
# "not given by the sources" -- the tool treats it as unknown and never guesses.
# Where sources disagree, every figure is kept with its source and the advisor
# uses the more conservative one (e.g. the lowest max use temperature).
#
# Chemical resistance levels: resistant | short | not | unknown
#   short = short exposure only.
#
# Sources (short keys used below):
#   grandpacad  GrandpaCAD material shrinkage calculator (shrinkage table)
#   bambu       Bambu Studio X-Y hole compensation starting values
#   create      CREATE Education whitepaper, Properties of 3D printing filaments (2024)
#   xometry     Xometry, 3D printing materials
#   sourcecad   SourceCAD material properties cheat sheet (min wall, infill)
#   protopasta  Proto-Pasta conductive PLA datasheet figure, via the overview
#   stopforth   Stopforth 2021, Conductive PLA filaments for 3D printed sensors

materials:
  - name: PLA
    base: PLA
    filler: null
    shrinkage: {typical: 0.3, min: 0.2, max: 0.5, source: grandpacad}
    hole_offset_mm: 0.05
    contour_offset_mm: 0.0
    max_use_temp_c:
      - {value: 40, source: create}
      - {value: 60, source: xometry}
    chemical: {acids: unknown, bases: not, water: unknown, solvents: not}
    uv_resistant: null
    tensile_mpa: null
    modulus_gpa: null
    elongation_pct: null
    resistivity_ohm_cm: null
    min_feature_mm: null
    min_wall_mm: 0.8
    infill_pct: {functional: [40, 100], decorative: [15, 25]}
    notes: "stiff but brittle, low impact"
    sources: [grandpacad, bambu, create, xometry, sourcecad]

  - name: PETG
